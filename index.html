<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سفراء الذاكرة">
<title>سفراء الذاكرة — ألعاب التوعية بمرض الزهايمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#f7f0ff; --bg2:#eadfff; --bg3:#d9c4ff;
  --violet:#7c3aed; --violet2:#a06bff; --deep:#3a1876; --ink:#2b1358; --muted:#6a5993;
  --gold:#dfa42a; --gold2:#f7dc86; --goldink:#5a3d00;
  --ok:#0f9d63; --okbg:#d6f6e6; --bad:#d92b4b; --badbg:#ffe1e7;
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.8);
  --neon:0 0 0 1.5px rgba(160,107,255,.7),0 0 18px rgba(160,107,255,.38),inset 0 0 14px rgba(255,255,255,.55);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:'Tajawal','Cairo','Segoe UI','Noto Naskh Arabic',Tahoma,sans-serif;font-size:17px;line-height:1.7;
  background:
    radial-gradient(1100px 650px at 88% -8%,#fff1cf 0,transparent 55%),
    radial-gradient(900px 700px at 0% 100%,#d5bcff 0,transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 60%,var(--bg3));
  background-attachment:fixed;overflow-x:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
h1,h2,h3{font-family:'Cairo','Tajawal',sans-serif;margin:0;line-height:1.35}
#bg,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#confetti{z-index:60}
#app{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:12px 14px 44px}

.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);box-shadow:var(--neon)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,#fff,#eadbff);box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(223,164,42,.55)}
.brand h1{font-size:clamp(1.25rem,3.6vw,1.75rem);font-weight:900;color:var(--deep)}
.brand p{margin:0;font-size:.85rem;color:var(--muted)}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--glass2);border:1.5px solid rgba(160,107,255,.55);font-weight:700;font-size:.95rem;color:var(--deep);font-family:inherit}
.chip.gold{border-color:var(--gold);background:linear-gradient(135deg,#fff8de,#fff)}
.chip.bump{animation:pop .5s}
button.chip{cursor:pointer}

/* nav */
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{font-family:inherit;font-weight:700;font-size:.95rem;color:var(--deep);cursor:pointer;min-height:44px;padding:8px 16px;border-radius:14px;border:1.5px solid rgba(160,107,255,.65);background:var(--glass2);box-shadow:0 0 12px rgba(160,107,255,.22);transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(160,107,255,.5)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.gcard:focus-visible,.mcell:focus-visible,.fcard:focus-visible,.ocard:focus-visible,.chip:focus-visible,.tchip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--violet),#9b5cff);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(124,58,237,.4),0 0 0 2px var(--gold2)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldink);border-color:transparent}
.btn.big{font-size:1.1rem;padding:12px 26px;min-height:52px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.nav .btn{flex:1 1 auto}

/* progress + teams */
.prog{margin:4px 2px 12px}
.prog-lbl{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.prog-bar{height:12px;border-radius:99px;background:rgba(255,255,255,.7);border:1px solid rgba(160,107,255,.4);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--violet2),var(--gold));transition:width .6s ease;box-shadow:0 0 10px rgba(160,107,255,.6)}
.teamstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tchip{font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:14px;background:var(--glass2);border:2px solid var(--c);font-weight:700;color:var(--ink);min-height:40px}
.tchip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.tchip.on{background:var(--c);color:#fff;box-shadow:0 0 16px var(--c)}
.tchip.on i{background:#fff}
.tchip b{font-weight:900}

/* menu */
.menu-head{padding:18px 20px;margin-bottom:14px}
.menu-head h2{font-size:1.35rem;color:var(--deep)}
.menu-head p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.gcard{font-family:inherit;text-align:right;cursor:pointer;padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--ink);transition:transform .2s,box-shadow .25s;position:relative}
.gcard:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--violet2),0 0 26px rgba(160,107,255,.55)}
.gcard .gi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(140deg,#fff,#eadbff);box-shadow:0 0 0 1.5px rgba(160,107,255,.6)}
.gcard h3{font-size:1.1rem;color:var(--deep)}
.gcard p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.55}
.gcard .gmeta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.pts{display:inline-block;padding:2px 12px;border-radius:99px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldink);font-weight:800;font-size:.85rem}
.gcard .done{font-weight:800;color:var(--ok);font-size:.85rem}
.gcard.fin{background:linear-gradient(160deg,rgba(255,248,222,.85),rgba(255,255,255,.6))}

/* stage */
.stage{padding:20px 18px}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1.5px dashed rgba(160,107,255,.45);margin-bottom:16px}
.gtitle{display:flex;gap:12px;align-items:center}
.gico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:29px;background:linear-gradient(140deg,#fff,#eadbff);box-shadow:0 0 0 1.5px rgba(160,107,255,.6)}
.ghead h2{font-size:1.4rem;color:var(--deep);font-weight:900}
.ghead p{margin:0;font-size:.9rem;color:var(--muted)}
.gbody{min-height:260px}
.fade{animation:fadeIn .45s ease both}
.lead{font-size:1.1rem;text-align:center;max-width:640px;margin:8px auto 18px}
.hint{text-align:center;font-weight:700;color:var(--violet);margin-bottom:10px}
.muted{color:var(--muted)}
.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0}
.intro-ico{font-size:64px;filter:drop-shadow(0 6px 14px rgba(124,58,237,.35));animation:float 3s ease-in-out infinite}
textarea,input[type=text],.inl{font-family:inherit;font-size:1.05rem;color:var(--ink);background:rgba(255,255,255,.9);border:2px solid rgba(160,107,255,.55);border-radius:14px;padding:10px 14px;width:100%;outline:none;transition:box-shadow .2s,border-color .2s}
textarea:focus,input:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(160,107,255,.25)}
textarea{resize:vertical;min-height:110px;max-width:640px;display:block;margin:0 auto}

/* timer */
.timer{display:flex;align-items:center;gap:14px;max-width:560px;margin:0 auto 14px}
.t-num{font-family:'Cairo',sans-serif;font-weight:900;font-size:1.9rem;min-width:70px;text-align:center;color:var(--deep);border:2px solid var(--gold);border-radius:14px;background:#fff;padding:0 8px}
.t-bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid rgba(160,107,255,.5);overflow:hidden}
.t-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--violet2),var(--gold));transition:width .2s linear}
.timer.crit .t-num{color:#fff;background:var(--bad);border-color:var(--bad);animation:pulse .55s infinite}
.timer.crit .t-bar i{background:var(--bad)}

/* memory grids */
.mgrid,.scene{display:grid;gap:10px;max-width:760px;margin:0 auto}
.mgrid{grid-template-columns:repeat(5,1fr)}
.scene{grid-template-columns:repeat(4,1fr)}
.mcell{font-family:inherit;aspect-ratio:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--glass2);border:1.5px solid rgba(160,107,255,.55);border-radius:18px;box-shadow:0 0 12px rgba(160,107,255,.2);color:var(--ink);transition:opacity .6s,transform .6s,background .25s,box-shadow .25s;padding:4px}
.mcell .em{font-size:clamp(1.7rem,6vw,2.8rem);line-height:1.1}
.mcell small{font-size:clamp(.7rem,2.4vw,.9rem);font-weight:700;color:var(--muted)}
.mgrid.hidden .mcell{opacity:0;transform:scale(.6)}
button.mcell{cursor:pointer}
.mcell.sel{background:#efe3ff;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet2),0 0 18px rgba(160,107,255,.6);transform:scale(1.04)}
.mcell.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok);animation:flipY .7s}
.mcell.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 0 0 3px var(--bad);animation:shake .5s}
.mcell.miss{background:#fff5d6;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.big-word{font-family:'Cairo',sans-serif;font-weight:900;font-size:clamp(2.6rem,12vw,5.5rem);color:var(--deep);text-align:center;min-height:130px;display:flex;align-items:center;justify-content:center;animation:pop .45s}
.dots{display:flex;justify-content:center;gap:8px;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(160,107,255,.25)}
.dots i.on{background:var(--violet);box-shadow:0 0 10px var(--violet2)}
.waitbox{text-align:center}
.waitbox .hg{font-size:64px;animation:float 2.4s ease-in-out infinite}

/* order game */
.slots,.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:820px;margin:0 auto}
.slot{position:relative;width:calc(25% - 10px);min-width:130px;min-height:150px;border:2.5px dashed rgba(160,107,255,.6);border-radius:18px;background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;padding:8px}
.slot.over{background:#efe3ff;border-color:var(--violet)}
.slot-n{position:absolute;top:-13px;right:12px;background:var(--violet);color:#fff;font-weight:800;border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:.85rem}
.pool{margin-top:22px;padding:14px;min-height:110px;border-radius:18px;background:rgba(255,255,255,.35);border:1.5px solid rgba(160,107,255,.3)}
.ocard{font-family:inherit;cursor:grab;width:100%;min-width:114px;padding:12px 8px;border-radius:16px;border:2px solid rgba(160,107,255,.65);background:#fff;box-shadow:0 4px 14px rgba(124,58,237,.22);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);transition:transform .2s}
.pool .ocard{width:auto;min-width:130px}
.ocard:hover{transform:translateY(-3px)}
.ocard .em{font-size:2.4rem;line-height:1.1}
.ocard b{font-size:.95rem}
.ocard.ok{background:var(--okbg);border-color:var(--ok);animation:flipY .7s}
.ocard.bad{background:var(--badbg);border-color:var(--bad);animation:shake .5s}
.answerline{margin:16px auto 0;max-width:820px;text-align:center;font-weight:700;background:#fff8de;border:1.5px solid var(--gold);border-radius:14px;padding:10px 14px}

/* who am I */
.wcard{width:min(300px,80%);aspect-ratio:3/4;margin:0 auto;perspective:900px}
.wcard .fin{cursor:pointer}
.wcard.show .fin{transform:rotateY(180deg)}
.wcard .ff{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--neon)}
.wcard .front{background:linear-gradient(150deg,var(--violet),#b58bff);color:#fff;font-size:4.5rem}
.wcard .back{background:#fff;font-size:5.2rem}
.wcard .back b{font-size:1.7rem;font-family:'Cairo',sans-serif;color:var(--deep)}
.counter{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;font-weight:800;flex-wrap:wrap}
.counter .n{font-size:1.9rem;font-family:'Cairo',sans-serif;color:var(--violet);min-width:44px;text-align:center}
.tips{max-width:640px;margin:14px auto 0;font-size:.9rem;color:var(--muted);text-align:center}

/* missing word */
.sent{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--glass2);border:1.5px solid rgba(160,107,255,.5);border-radius:16px;padding:14px 16px;margin:0 auto 12px;max-width:720px;font-size:1.2rem;font-weight:700}
.sent .inl{width:min(240px,100%);text-align:center;padding:6px 10px}
.sent.ok{background:var(--okbg);border-color:var(--ok);animation:flipY .7s}
.sent.bad{background:var(--badbg);border-color:var(--bad);animation:shake .5s}
.sent small{flex-basis:100%;text-align:center;font-weight:700;font-size:.9rem}

/* flip cards */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:640px;margin:0 auto}
.fcard{font-family:inherit;background:none;border:0;padding:0;cursor:pointer;perspective:800px;aspect-ratio:1/1.08;color:var(--ink)}
.fin{position:relative;width:100%;height:100%;transition:transform .65s;transform-style:preserve-3d}
.fcard.on .fin{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fcard .front{background:linear-gradient(150deg,#8b52f5,#b58bff);color:#fff;font-size:2.8rem;box-shadow:var(--neon);font-weight:900}
.fcard .back{transform:rotateY(180deg);background:#fffdf3;border:2.5px solid var(--gold);box-shadow:0 0 16px rgba(223,164,42,.5)}
.fcard .back .em{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1.1}
.fcard .back b{font-size:clamp(.85rem,3vw,1.1rem);text-align:center;padding:0 4px}

/* true false */
.tfq{font-family:'Cairo',sans-serif;font-weight:800;font-size:clamp(1.2rem,4.2vw,1.7rem);text-align:center;max-width:720px;margin:0 auto 20px;padding:22px 18px;background:var(--glass2);border-radius:20px;border:2px solid rgba(160,107,255,.5)}
.tfq.ok{background:var(--okbg);border-color:var(--ok);animation:flipY .7s}
.tfq.bad{background:var(--badbg);border-color:var(--bad);animation:shake .5s}
.tfbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tfbtns .btn{font-size:1.3rem;min-width:150px;min-height:60px}
.btn.yes{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--bad);color:var(--bad)}
.qcount{text-align:center;font-weight:700;color:var(--muted);margin-bottom:10px}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(43,19,88,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fadeIn .25s both}
.modal{position:relative;width:min(560px,100%);max-height:88vh;overflow:auto;padding:26px 22px;background:rgba(255,255,255,.9);animation:zoomIn .4s both}
.modal h3{font-size:1.4rem;color:var(--deep);text-align:center;margin-bottom:10px}
.mclose{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(160,107,255,.6);background:#fff;cursor:pointer;font-size:1rem;color:var(--deep)}
.res{text-align:center}
.res-ico{font-size:58px}
.res-score{font-family:'Cairo',sans-serif;display:flex;justify-content:center;align-items:baseline;gap:8px;margin:2px 0 10px}
.res-score b{font-size:3.4rem;color:var(--violet);font-weight:900;line-height:1}
.res-score span{font-size:1.4rem;color:var(--muted);font-weight:700}
.msg{background:#fff8de;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;font-weight:700;margin:12px 0}
.res-best{font-size:.85rem;color:var(--muted);margin-bottom:12px}
.res-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.pill{padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:700;border:1.5px solid}
.pill.ok{background:var(--okbg);border-color:var(--ok);color:#075c39}
.pill.no{background:var(--badbg);border-color:#f0a2b1;color:#8a1730}
.sub{font-size:.85rem;font-weight:700;color:var(--muted);margin-top:8px}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid rgba(160,107,255,.25);text-align:center}
.tbl th:first-child,.tbl td:first-child{text-align:right}
.tbl tfoot td{font-weight:900;color:var(--deep);border-top:2px solid var(--gold)}
.ambassador{margin:14px 0 0;text-align:center;font-weight:900;font-family:'Cairo',sans-serif;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--goldink);font-size:1.15rem}
.seg{display:flex;gap:8px;justify-content:center;margin:10px 0}
.tnames{display:grid;gap:8px;margin:10px 0}
.tname{display:flex;align-items:center;gap:10px}
.tname i{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px var(--c)}
.sources{padding-inline-start:22px;margin:8px 0 0}
.sources li{margin-bottom:4px}
.closing{padding:22px 18px}
.closing h2{text-align:center;font-size:1.6rem;color:var(--deep);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--deep);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;z-index:70;transition:all .35s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flipY{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

@media (max-width:640px){
  body{font-size:16px}
  .nav .btn{flex:1 1 30%;padding:8px 6px;font-size:.85rem}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .scene{grid-template-columns:repeat(3,1fr)}
  .slot{width:calc(50% - 10px);min-width:0}
  .fgrid{gap:10px}
  .stage{padding:16px 12px}
  .tfbtns .btn{min-width:130px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(function(){
'use strict';

/* ================= أدوات عامة ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const ar=x=>String(x).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace('.','٫');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);

/* تطبيع النص العربي للمقارنة */
function norm(s){
  return String(s||'')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^\u0621-\u064A0-9a-zA-Z\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
/* مطابقة الكلمات المكتوبة مع قائمة العناصر — يعيد فهارس العناصر المتذكَّرة (دون تكرار) */
function matchWords(text,items){
  const toks=norm(text).split(' ').filter(Boolean);
  const cands=new Set();
  toks.forEach(t=>{
    cands.add(t);
    if(t.startsWith('ال'))cands.add(t.slice(2));
    if(t.startsWith('و')){cands.add(t.slice(1));if(t.slice(1).startsWith('ال'))cands.add(t.slice(3));}
  });
  const hit=[];
  items.forEach((it,i)=>{
    const al=[it[1]].concat(it[2]||[]).map(norm);
    if(al.some(a=>cands.has(a)))hit.push(i);
  });
  return hit;
}

/* مؤقتات مُدارة */
const T={ids:[],
  to(fn,ms){const id=setTimeout(fn,ms);this.ids.push(['t',id]);return id},
  iv(fn,ms){const id=setInterval(fn,ms);this.ids.push(['i',id]);return id},
  clear(){this.ids.forEach(([k,id])=>k==='t'?clearTimeout(id):clearInterval(id));this.ids=[]}
};

/* ================= الحالة والتخزين ================= */
const KEY='alz_memory_ambassador_v1';
const COLORS=['#7c3aed','#e11d74','#0c9f9a','#e58a00'];
function defaults(){return{teamMode:false,active:0,solo:{},teams:[],streak:0,bestStreak:0,muted:false}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(defaults(),JSON.parse(r))}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const target=()=>(S.teamMode&&S.teams[S.active])?S.teams[S.active].scores:S.solo;
function setScore(id,val){
  const t=target();
  const prev=t[id];
  t[id]=(prev==null)?val:Math.max(prev,val); /* تُحفظ أفضل نتيجة فلا تتكرر النقاط عند إعادة اللعب */
  save();renderHeader();
  return t[id];
}

/* ================= الأصوات (Web Audio) ================= */
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,vol,delay,slide){
  if(S.muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function applause(){
  if(S.muted)return;const a=ac();if(!a)return;
  const len=Math.floor(a.sampleRate*.06),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  for(let k=0;k<38;k++){
    const t=a.currentTime+Math.random()*1.8,src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    src.buffer=buf;f.type='bandpass';f.frequency.value=1500+Math.random()*2500;f.Q.value=.8;
    g.gain.value=.25+Math.random()*.25;src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);
  }
}
const SFX={
  click(){tone(620,.07,'triangle',.1)},
  ok(){tone(660,.12,'sine',.16);tone(880,.2,'sine',.16,.1)},
  bad(){tone(200,.28,'sawtooth',.1,0,110);tone(150,.3,'sawtooth',.08,.12,90)},
  tick(){tone(1100,.04,'square',.05)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.16,i*.13));applause()}
};

/* ================= مؤثرات بصرية ================= */
const cv=$('#confetti'),cx=cv.getContext('2d');
const bgc=$('#bg'),bx=bgc.getContext('2d');
function sizeCanvases(){cv.width=bgc.width=innerWidth;cv.height=bgc.height=innerHeight}
sizeCanvases();addEventListener('resize',sizeCanvases);
let confettiOn=false;
function confetti(){
  if(confettiOn)return;confettiOn=true;
  const n=RM?40:150,cols=['#7c3aed','#a06bff','#dfa42a','#f7dc86','#e11d74','#0c9f9a','#ffffff'];
  const P=Array.from({length:n},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,w:6+Math.random()*7,h:9+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const end=Date.now()+4200;
  (function frame(){
    cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(Date.now()<end)requestAnimationFrame(frame);else{cx.clearRect(0,0,cv.width,cv.height);confettiOn=false}
  })();
}
/* جزيئات الخلفية */
const blobs=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),r:6+Math.random()*24,vx:(Math.random()-.5)*.00025,vy:-.00005-Math.random()*.0002,c:Math.random()<.22?'223,164,42':'160,107,255',a:.1+Math.random()*.16}));
function drawBg(){
  bx.clearRect(0,0,bgc.width,bgc.height);
  blobs.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;if(b.y<-.05){b.y=1.05;b.x=Math.random()}if(b.x<-.05)b.x=1.05;if(b.x>1.05)b.x=-.05;
    const X=b.x*bgc.width,Y=b.y*bgc.height,g=bx.createRadialGradient(X,Y,0,X,Y,b.r);
    g.addColorStop(0,`rgba(${b.c},${b.a+.15})`);g.addColorStop(1,`rgba(${b.c},0)`);
    bx.fillStyle=g;bx.beginPath();bx.arc(X,Y,b.r,0,7);bx.fill();
  });
  if(!RM&&!document.hidden)requestAnimationFrame(drawBg);
}
drawBg();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!RM)requestAnimationFrame(drawBg)});

/* ================= بيانات الألعاب ================= */
const GAMES=[
 {id:1,icon:'🧠',name:'اختبري ذاكرتك',max:10,goal:'إظهار أن الذاكرة قد تتأثر، وأن النسيان العرضي طبيعي.',msg:'النسيان العرضي طبيعي، لكن عندما يتكرر ويعطّل الحياة اليومية، يستحق الانتباه'},
 {id:2,icon:'👀',name:'ماذا تغيّر؟',max:10,goal:'إظهار أهمية التركيز والانتباه للذاكرة.',msg:'التركيز والانتباه أساس الذاكرة'},
 {id:3,icon:'🔤',name:'تذكّري الكلمات',max:8,goal:'محاكاة تأثير الزهايمر على الذاكرة قصيرة المدى.',msg:'الذاكرة قصيرة المدى هي أول ما يتأثر عند المصاب'},
 {id:4,icon:'⏳',name:'رتّبي الأحداث',max:10,goal:'إظهار صعوبة ترتيب الأحداث اليومية لدى المصاب.',msg:'ترتيب الأحداث اليومية تحدي حقيقي لمصاب الزهايمر'},
 {id:5,icon:'🕵️‍♀️',name:'من أنا؟',max:5,goal:'إظهار أهمية طرح الأسئلة للنشاط الذهني.',msg:'طرح الأسئلة مهارة ذهنية تحافظ على نشاط الدماغ'},
 {id:6,icon:'🧩',name:'الكلمة المفقودة',max:5,goal:'إظهار أن الذاكرة الدلالية أطول عمرًا.',msg:'الذاكرة الدلالية (المعاني) أطول عمرًا من الذاكرة الحديثة'},
 {id:7,icon:'📸',name:'صورة من الماضي',max:8,goal:'إظهار أن الذاكرة طويلة المدى تبقى، وهذا مصدر أمل.',msg:'الذاكرة طويلة المدى تبقى، وهذا ما يمنح الأمل في التعامل مع المصاب'},
 {id:8,icon:'🚦',name:'صح أم خطأ؟',max:10,goal:'التمييز بين النسيان الطبيعي والمرضي.',msg:'التمييز بين النسيان الطبيعي والمرضي واجب توعوي'}
];
const TOTAL=GAMES.reduce((a,g)=>a+g.max,0); /* 66 */

const G1_ITEMS=[
 ['🍎','تفاحة',['تفاحه','تفاح']],['🔑','مفتاح',['مفاتيح']],['🏫','مدرسة',['مدارس']],['🌙','قمر',['هلال']],
 ['📚','كتاب',['كتب']],['🌹','وردة',['ورد','وردات']],['🚗','سيارة',['سيارات']],['🥤','كوب',['كاس','كأس','اكواب']],
 ['☀️','شمس',[]],['✏️','قلم',['اقلام']],['🚪','باب',['ابواب']],['🐦','طير',['طائر','عصفور','طيور']],
 ['🌊','بحر',['بحار','موج','امواج']],['⏰','ساعة',['ساعات','ساعه']],['🥄','ملعقة',['معلقة','ملاعق']]
];
const G3_ITEMS=G1_ITEMS.slice(0,8);
const G2_BASE=[['🪑','كرسي'],['📘','كتاب'],['💻','حاسوب'],['⏰','ساعة'],['🚪','باب'],['🪟','نافذة'],['✏️','قلم'],['📏','مسطرة'],['🎒','حقيبة'],['🪴','نبتة'],['📓','دفتر'],['🏰','قلعة']];
const G2_POOL=[['🍎','تفاحة'],['🔑','مفتاح'],['🎈','بالون'],['🧸','دمية'],['🕯️','شمعة'],['☂️','مظلة'],['🎧','سماعة'],['🌙','قمر']];
const G4_CARDS=[['🍞','شراء الخبز'],['🚗','ركوب السيارة'],['🏠','العودة للمنزل'],['🍽️','تناول الطعام']];
const G5_DECK=[['👩‍🏫','معلمة'],['👩‍⚕️','طبيبة'],['☕','قهوة'],['📖','كتاب'],['🏫','مدرسة']];
const G6_SENT=[
 {pre:'العلم نور و',post:'',full:'الجهل ظلام',keys:['جهل','ظلام']},
 {pre:'من جد وجد ومن زرع',post:'',full:'حصد',keys:['حصد','حصاد']},

const G8_Q=[
 {t:'الزهايمر هو نفسه النسيان الطبيعي',a:false},

 {t:'الدعم والتواصل مهمان للمصاب',a:true}
];
const SOURCES=[
 'منظمة الصحة العالمية (WHO) — تقرير الخرف العالمي 2023.',
 'الجمعية الدولية لمرض الزهايمر (ADI) — World Alzheimer Report.',

/* ================= الواجهة العامة ================= */
let curGame=null,view='menu';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

function hit(){S.streak++;S.bestStreak=Math.max(S.bestStreak||0,S.streak);save();renderHeader(true);if(S.streak>=3&&S.streak%3===0)toast('🔥 '+ar(S.streak)+' إجابات صحيحة متتالية!')}

function renderHeader(bump){
  const t=target();

  $('#chipTotal').innerHTML='🏆 '+ar(tot)+' / '+ar(TOTAL)+nm;

  if(bump){cs.classList.remove('bump');void cs.offsetWidth;cs.classList.add('bump')}
  const done=Object.keys(t).length,pct=Math.round(done/GAMES.length*100);
  $('#progLbl').textContent='الإنجاز: '+ar(done)+' من '+ar(GAMES.length)+' ألعاب';
  $('#progPct').textContent=ar(pct)+'٪';
  $('#progFill').style.width=pct+'%';
  $('#btnSound').textContent=S.muted?'🔇':'🔊';
  const ts=$('#teamstrip');
  if(S.teamMode&&S.teams.length){
    ts.hidden=false;
    ts.innerHTML=S.teams.map((tm,i)=>`<button class="tchip ${i===S.active?'on':''}" data-team="${i}" style="--c:${tm.color}" aria-pressed="${i===S.active}"><i></i>${esc(tm.name)} <b>${ar(sum(tm.scores))}</b></button>`).join('');
  }else{ts.hidden=true;ts.innerHTML=''}
}

/* ---- النوافذ ---- */
const modalOpen=()=>!!$('#modalRoot .modal-bg');
function closeModal(){$('#modalRoot').innerHTML=''}
function openModal(html,cls){
  closeModal();
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal glass ${cls||''}" role="dialog" aria-modal="true">${html}<button class="mclose" aria-label="إغلاق" data-close>✕</button></div>`;

  const f=$('.btn.primary',bg)||$('.btn',bg);if(f)f.focus({preventScroll:true});

}

/* ---- المؤقت المرئي ---- */
function timerHTML(id){return `<div class="timer" id="${id||'tm'}" role="timer"><div class="t-num">٠</div><div class="t-bar"><i></i></div></div>`}
function runTimer(sec,onEnd,id){
  const el=$('#'+(id||'tm'));if(!el)return{stop(){}};
  const num=$('.t-num',el),bar=$('.t-bar i',el);
  const end=Date.now()+sec*1000;let last=-1,over=false;
  const fmt=s=>sec>=60?ar(Math.floor(s/60))+':'+ar(String(s%60).padStart(2,'0')):ar(s);
  const upd=()=>{
    const left=Math.max(0,end-Date.now()),s=Math.ceil(left/1000);
    num.textContent=fmt(s);bar.style.width=(left/(sec*1000)*100)+'%';
    const crit=s<=5&&s>0;el.classList.toggle('crit',crit);
    if(s!==last){last=s;if(crit)SFX.tick()}
    if(left<=0&&!over){over=true;clearInterval(h);onEnd()}
  };
  const h=T.iv(upd,200);upd();
  return{stop(){over=true;clearInterval(h)}};
}

/* ---- مساعدات مشتركة للألعاب ---- */
function body(html){const b=$('#gbody');if(!b)return;b.classList.remove('fade');void b.offsetWidth;b.innerHTML=html;b.classList.add('fade')}
function intro(g,text,onStart,label){

  $('#goBtn').onclick=()=>{ac();SFX.click();onStart()};
}
function showResult(g,score,extra){
  const best=setScore(g.id,score);
  const win=score>=g.max*0.6;
  const bg=openModal(`<div class="res"><div class="res-ico" aria-hidden="true">${win?'🏆':'🌱'}</div><h3>${win?'أحسنتِ!':'شكرًا لمشاركتكِ'}</h3>
    <div class="res-score"><b>${ar(score)}</b><span>/ ${ar(g.max)}</span></div>${extra||''}
    <div class="msg">💜 «${g.msg}»</div>
    <div class="res-best">أفضل نتيجة محفوظة لهذه اللعبة: ${ar(best)} / ${ar(g.max)}</div>
    <div class="res-btns">
      <button class="btn primary" data-act="next">${g.id<8?'➡️ اللعبة التالية':'🎓 الشريحة الختامية'}</button>
      <button class="btn" data-act="again">🔁 إعادة اللعبة</button>
      <button class="btn" data-act="menu">🏠 القائمة الرئيسية</button>
    </div></div>`,'res-modal');
  bg.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='next'){g.id<8?startGame(g.id+1):showClosing()}

      <div class="scene">${G2_BASE.map(it=>cell(it)).join('')}</div>
      <div class="row"><button class="btn" id="skip">أنا جاهزة</button></div>`);
    let over=false;
    const finish=()=>{if(over)return;over=true;change()};

  });

    body(`<div class="lead" style="margin-top:60px">🔄 يتم تغيير المشهد…</div>`);

  }
  function choose(){
    const changed=shuffle([...Array(12).keys()]).slice(0,5);
    const repl=shuffle(G2_POOL).slice(0,5);
    const items=G2_BASE.map((it,i)=>changed.includes(i)?repl[changed.indexOf(i)]:it);
    const sel=new Set();let locked=false;
    body(`<div class="hint">اضغطي على العناصر الـ ٥ التي تغيّرت</div><div class="qcount" id="cnt"></div>
      <div class="scene" id="sc">${items.map((it,i)=>`<button class="mcell" data-i="${i}" aria-pressed="false"><span class="em">${it[0]}</span><small>${it[1]}</small></button>`).join('')}</div>
      <div class="row"><button class="btn primary big" id="ok" data-enter>✔️ تأكيد الإجابة</button></div>`);
    const cnt=()=>$('#cnt').textContent='المحدَّد: '+ar(sel.size)+' من ٥';cnt();
    $('#sc').addEventListener('click',e=>{
      const b=e.target.closest('.mcell');if(!b||locked)return;
      const i=+b.dataset.i;
      if(sel.has(i)){sel.delete(i);b.classList.remove('sel');b.setAttribute('aria-pressed','false')}
      else if(sel.size<5){sel.add(i);b.classList.add('sel');b.setAttribute('aria-pressed','true')}

      SFX.click();cnt();
    });
    $('#ok').onclick=()=>{
      if(locked)return;
      if(sel.size===0){toast('اختاري عنصرًا واحدًا على الأقل');return}
      locked=true;let good=0;
      $$('#sc .mcell').forEach(b=>{
        const i=+b.dataset.i;b.classList.remove('sel');
        if(sel.has(i)){
          if(changed.includes(i)){b.classList.add('ok');good++;hit()}
          else{b.classList.add('bad');miss()}
        }else if(changed.includes(i)){b.classList.add('miss')}
      });
      good?SFX.ok():SFX.bad();
      $('#ok').disabled=true;
      T.to(()=>showResult(g,good*2,`<p>أصبتِ <b>${ar(good)}</b> من ٥ تغييرات</p>
        <div class="chips">${chipsOf(changed.map(i=>G2_BASE[i][0]+' '+G2_BASE[i][1]+' ← '+items[i][0]+' '+items[i][1]),'ok')}</div>`),1700);

/* ================= اللعبة 4: رتّبي الأحداث ================= */
function run4(g){
  intro(g,'رتّبي بطاقات الأحداث من البداية إلى النهاية: اضغطي على البطاقة لوضعها في الخانة التالية، أو اسحبيها إلى الخانة التي تريدينها.',start);
  function start(){
    let order=[0,1,2,3];
    do{order=shuffle(order)}while(order.every((v,i)=>v===i));
    let pool=order.slice(),slots=[null,null,null,null],locked=false;
    const card=(id,cls)=>`<button class="ocard ${cls||''}" draggable="true" data-id="${id}"><span class="em">${G4_CARDS[id][0]}</span><b>${G4_CARDS[id][1]}</b></button>`;
    body(`<div class="hint">الترتيب من البداية إلى النهاية</div><div class="slots" id="slots"></div><div class="pool" id="pool" aria-label="البطاقات"></div>
      <div id="ans"></div><div class="row"><button class="btn primary big" id="ok" data-enter disabled>✔️ تأكيد الترتيب</button></div>`);
    function draw(){
      $('#slots').innerHTML=slots.map((id,i)=>`<div class="slot" data-slot="${i}"><span class="slot-n">${ar(i+1)}</span>${id!=null?card(id):''}</div>`).join('');
      $('#pool').innerHTML=pool.map(id=>card(id)).join('');
      $('#ok').disabled=locked||slots.some(s=>s==null);
    }
    function remove(id){pool=pool.filter(x=>x!==id);slots=slots.map(s=>s===id?null:s)}
    function place(id,slot){
      remove(id);
      const old=slots[slot];if(old!=null)pool.push(old);
      slots[slot]=id;
    }
    draw();
    const root=$('#gbody');
    root.addEventListener('click',e=>{
      if(locked)return;
      const c=e.target.closest('.ocard');if(!c)return;
      const id=+c.dataset.id;SFX.click();
      if(c.closest('.slot')){remove(id);pool.push(id)}
      else{const free=slots.indexOf(null);if(free>-1)place(id,free)}
      draw();
    });
    root.addEventListener('dragstart',e=>{const c=e.target.closest('.ocard');if(!c||locked)return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'});
    root.addEventListener('dragover',e=>{if(locked)return;const s=e.target.closest('.slot,.pool');if(s){e.preventDefault();if(s.classList.contains('slot'))s.classList.add('over')}});
    root.addEventListener('dragleave',e=>{const s=e.target.closest('.slot');if(s)s.classList.remove('over')});
    root.addEventListener('drop',e=>{
      if(locked)return;const s=e.target.closest('.slot,.pool');if(!s)return;
      e.preventDefault();const id=+e.dataTransfer.getData('text/plain');if(isNaN(id))return;
      SFX.click();
      if(s.classList.contains('slot'))place(id,+s.dataset.slot);else{remove(id);pool.push(id)}
      draw();
    });
    $('#ok').onclick=()=>{
      if(locked||slots.some(s=>s==null))return;
      locked=true;
      const right=slots.every((id,i)=>id===i);
      $$('#slots .ocard').forEach((c,i)=>{const good=slots[i]===i;c.classList.add(right||good?'ok':'bad');c.draggable=false});
      if(right){hit();SFX.ok()}else{miss();SFX.bad();
        $('#ans').innerHTML=`<div class="answerline">الترتيب الصحيح: ${G4_CARDS.map(c=>c[0]+' '+c[1]).join(' ← ')}</div>`}
      $('#ok').disabled=true;
      T.to(()=>showResult(g,right?10:0,right?'<p>ترتيب صحيح كامل! 🎉</p>':'<p>الترتيب غير صحيح هذه المرة.</p>'),1700);
    };
  }
}

    $('#giveup').onclick=()=>{if(over)return;over=true;wc.classList.add('show');miss();SFX.bad();T.to(()=>showResult(g,0,`<p>الكلمة كانت: <b>${c[0]} ${c[1]}</b></p>`),1300)};

/* ---- سفير الذاكرة ---- */
function ambassadors(){
  if(S.teamMode&&S.teams.length){
    const tots=S.teams.map(t=>sum(t.scores)),mx=Math.max.apply(null,tots);
    if(mx<=0)return[];
    return S.teams.filter((t,i)=>tots[i]===mx).map(t=>t.name);
  }
  return Object.keys(S.solo).length===GAMES.length?['أنتِ']:[];
}
function ambBanner(){
  const a=ambassadors();
  return a.length?`<div class="ambassador">🧠💜 لقب «سفير الذاكرة»: ${a.map(esc).join(' و ')}</div>`:'';
}

/* ---- الشريحة الختامية ---- */
function showClosing(){
  T.clear();closeModal();curGame=null;view='closing';
  const t=target();
  $('#view').innerHTML=`<section class="closing glass fade"><h2>🎓 الشريحة الختامية</h2>
    <p class="lead">شكرًا لمشاركتكنّ! مجموع النقاط: <b>${ar(sum(t))}</b> من ${ar(TOTAL)}</p>
    ${ambBanner()}
    <h3 style="margin-top:18px">📌 المصادر العلمية</h3><ul class="sources">${SOURCES.map(s=>`<li>${s}</li>`).join('')}</ul>
    <div class="row"><button class="btn primary" id="cScore">🏆 لوحة النقاط</button><button class="btn" id="cMenu">🏠 القائمة الرئيسية</button></div></section>`;
  $('#cScore').onclick=showScoreboard;$('#cMenu').onclick=showMenu;
  if(ambassadors().length){SFX.win();confetti()}
}

/* ---- لوحة النقاط ---- */
function showScoreboard(){
  let html='<h3>🏆 لوحة النقاط</h3>';
  if(S.teamMode&&S.teams.length){
    html+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>اللعبة</th>${S.teams.map(t=>`<th style="color:${t.color}">${esc(t.name)}</th>`).join('')}</tr></thead><tbody>
      ${GAMES.map(g=>`<tr><td>${g.icon} ${g.name} <small>(${ar(g.max)})</small></td>${S.teams.map(t=>`<td>${t.scores[g.id]!=null?ar(t.scores[g.id]):'—'}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td>المجموع (${ar(TOTAL)})</td>${S.teams.map(t=>`<td>${ar(sum(t.scores))}</td>`).join('')}</tr></tfoot></table></div>`;
  }else{
    html+=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>اللعبة</th><th>النقاط</th></tr></thead><tbody>
      ${GAMES.map(g=>`<tr><td>${g.icon} ${g.name}</td><td>${S.solo[g.id]!=null?ar(S.solo[g.id]):'—'} / ${ar(g.max)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>المجموع</td><td>${ar(sum(S.solo))} / ${ar(TOTAL)}</td></tr></tfoot></table></div>`;
  }
  html+=ambBanner();
  html+=`<div class="row"><button class="btn primary" data-close>إغلاق</button></div>`;
  openModal(html);
}

/* ---- إعداد الفرق ---- */
function showTeams(){
  let n=Math.min(4,Math.max(2,S.teams.length||2));
  const names=[0,1,2,3].map(i=>S.teams[i]?S.teams[i].name:'الفريق '+ar(i+1));
  const bg=openModal('<div id="tmBody"></div>');
  const draw=()=>{
    $('#tmBody',bg).innerHTML=`<h3>👥 إعداد الفرق</h3><p class="muted" style="text-align:center;margin:0">اختاري عدد الفرق (٢–٤). تُسجَّل نقاط كل لعبة للفريق النشط، ويمكن تبديله من الشريط أعلى الصفحة.</p>
      <div class="seg">${[2,3,4].map(k=>`<button class="btn ${k===n?'primary':''}" data-n="${k}">${ar(k)} فرق</button>`).join('')}</div>
      <div class="tnames">${Array.from({length:n},(_,i)=>`<label class="tname" style="--c:${COLORS[i]}"><i></i><input type="text" maxlength="20" value="${esc(names[i])}" data-i="${i}" aria-label="اسم الفريق ${ar(i+1)}"></label>`).join('')}</div>
      <div class="row"><button class="btn primary" data-apply>${S.teamMode?'حفظ التغييرات':'تفعيل وضع الفرق'}</button>${S.teamMode?'<button class="btn" data-off>إيقاف وضع الفرق</button>':''}</div>`;
  };
  const grab=()=>$$('.tname input',bg).forEach(inp=>names[+inp.dataset.i]=inp.value);
  draw();
  bg.addEventListener('click',e=>{
    const nb=e.target.closest('[data-n]');
    if(nb){grab();n=+nb.dataset.n;draw();return}
    if(e.target.closest('[data-apply]')){
      grab();
      S.teams=Array.from({length:n},(_,i)=>({name:(names[i]||'').trim()||'الفريق '+ar(i+1),color:COLORS[i],scores:(S.teams[i]&&S.teams[i].scores)||{}}));
      S.teamMode=true;if(S.active>=n)S.active=0;save();closeModal();
      view==='menu'?showMenu():renderHeader();toast('تم تفعيل وضع الفرق 👥');
    }
    if(e.target.closest('[data-off]')){S.teamMode=false;save();closeModal();view==='menu'?showMenu():renderHeader();toast('تم إيقاف وضع الفرق')}
  });
}

/* ---- إعادة البدء ---- */
function confirmReset(){
  const bg=openModal(`<div class="res"><div class="res-ico">⚠️</div><h3>إعادة البدء؟</h3><p>سيتم مسح جميع النقاط والفرق والسلسلة، ولا يمكن التراجع عن ذلك.</p>
    <div class="res-btns"><button class="btn primary" data-yes>نعم، أعيدي البدء</button><button class="btn" data-close>إلغاء</button></div></div>`);
  bg.addEventListener('click',e=>{
    if(e.target.closest('[data-yes]')){
      const m=S.muted;S=defaults();S.muted=m;save();closeModal();showMenu();toast('تمت إعادة التعيين بالكامل');
    }
  });
}

/* ---- التقارير: حفظ ومشاركة ---- */
function reportObj(){
  const o={title:'نتائج ألعاب التوعية بمرض الزهايمر — سفراء الذاكرة',date:new Date().toISOString(),maxTotal:TOTAL,mode:S.teamMode?'teams':'solo',
    games:GAMES.map(g=>({id:g.id,name:g.name,max:g.max}))};
  if(S.teamMode&&S.teams.length){
    o.teams=S.teams.map(t=>({name:t.name,total:sum(t.scores),scores:GAMES.map(g=>({game:g.name,score:t.scores[g.id]==null?null:t.scores[g.id],max:g.max}))}));
  }else{
    o.total=sum(S.solo);o.scores=GAMES.map(g=>({game:g.name,score:S.solo[g.id]==null?null:S.solo[g.id],max:g.max}));
  }
  o.ambassador=ambassadors();o.bestStreak=S.bestStreak||0;
  return o;
}
function reportText(){
  const L=['🧠 نتائج ألعاب التوعية بمرض الزهايمر — «سفراء الذاكرة»','التاريخ: '+new Date().toLocaleDateString('ar-EG'),''];
  const lines=sc=>GAMES.map(g=>'• '+g.name+': '+(sc[g.id]!=null?ar(sc[g.id]):'—')+' / '+ar(g.max));
  if(S.teamMode&&S.teams.length){
    S.teams.forEach(t=>{L.push('👥 '+t.name+' — المجموع: '+ar(sum(t.scores))+' / '+ar(TOTAL));L.push(...lines(t.scores));L.push('')});
  }else{L.push('المجموع: '+ar(sum(S.solo))+' / '+ar(TOTAL));L.push(...lines(S.solo));L.push('')}
  const a=ambassadors();if(a.length)L.push('🏅 لقب «سفير الذاكرة»: '+a.join(' و '));
  L.push('🔥 أفضل سلسلة إجابات متتالية: '+ar(S.bestStreak||0));
  return L.join('\n');
}
function download(name,mime,text){
  const b=new Blob([text],{type:mime+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function showSave(){
  const bg=openModal(`<div class="res"><div class="res-ico">💾</div><h3>حفظ النتائج</h3><p>اختاري صيغة الملف:</p>
    <div class="res-btns"><button class="btn primary" data-f="json">تنزيل JSON</button><button class="btn" data-f="txt">تنزيل TXT</button></div></div>`);
  bg.addEventListener('click',e=>{
    const b=e.target.closest('[data-f]');if(!b)return;
    if(b.dataset.f==='json')download('alzheimer-games-results.json','application/json',JSON.stringify(reportObj(),null,2));
    else download('alzheimer-games-results.txt','text/plain','\ufeff'+reportText());
    closeModal();toast('تم تنزيل الملف ✔️');
  });
}
function share(){
  const text=reportText();
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'تم نسخ الملخص إلى الحافظة 📋':'تعذّر النسخ تلقائيًا')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('تم نسخ الملخص إلى الحافظة 📋'),fallback);
  else fallback();
}

/* ================= الأحداث العامة ================= */
$('#btnMenu').onclick=()=>{SFX.click();showMenu()};
$('#btnScore').onclick=()=>{SFX.click();showScoreboard()};
$('#btnTeams').onclick=()=>{SFX.click();showTeams()};
$('#btnReset').onclick=()=>{SFX.click();confirmReset()};
$('#btnSave').onclick=()=>{SFX.click();showSave()};
$('#btnShare').onclick=()=>{SFX.click();share()};
$('#btnSound').onclick=()=>{S.muted=!S.muted;save();renderHeader();if(!S.muted){ac();SFX.click()}};
$('#teamstrip').addEventListener('click',e=>{
  const b=e.target.closest('[data-team]');if(!b)return;
  S.active=+b.dataset.team;save();SFX.click();
  if(view==='menu')showMenu();else renderHeader();
  toast('الفريق النشط: '+S.teams[S.active].name);
});
$('#view').addEventListener('click',e=>{
  const c=e.target.closest('[data-game]');if(!c)return;
  ac();SFX.click();
  c.dataset.game==='closing'?showClosing():startGame(+c.dataset.game);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(modalOpen())closeModal();
    else if(view!=='menu')showMenu();
    return;
  }
  if(e.key==='Enter'){
    const tg=e.target.tagName;
    if(tg==='INPUT'||tg==='TEXTAREA'||tg==='BUTTON'||tg==='A')return;
    const m=$('#modalRoot .btn.primary');
    if(m){e.preventDefault();m.click();return}
    const b=$('#view [data-enter]:not([disabled])');
    if(b){e.preventDefault();b.click()}
  }
});

/* بدء التشغيل */
showMenu();
})();

// تشغيل PWA والتخزين دون اتصال عند فتح الموقع عبر HTTPS.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
